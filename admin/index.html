<body>
  <!-- Decap CMS con GitHub OAuth via Cloudflare Worker.
       Versión fijada + Subresource Integrity (SRI): si el archivo del CDN
       cambia (o es manipulado), el navegador NO lo ejecuta.
       Para actualizar Decap: subir la versión y regenerar el hash con
       curl -s https://unpkg.com/decap-cms@<versión>/dist/decap-cms.js | openssl dgst -sha384 -binary | openssl base64 -A -->
  <script
    src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"
    integrity="sha384-in6eHztHveqQ7uMZ1fDaKlDmacQLFuLH2wWrFTiymyuS8zQ5bixwL8U3AeRi8h/L"
    crossorigin="anonymous"></script>
</body>
</html>
